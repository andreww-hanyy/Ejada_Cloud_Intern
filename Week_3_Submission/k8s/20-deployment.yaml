apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: ejada-w3
  labels:
    app: nginx-demo
spec:
  # A ReadWriteOnce block volume can only be attached to one node at a time,
  # so a second replica would sit Pending forever. Recreate makes rollouts
  # detach the volume before the new pod tries to claim it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      # Seed the block volume ONCE, so the page proves the data is coming off
      # the attached volume and not out of the container image.
      #
      # The guard matters: this init container runs on every pod start, so
      # without it the replacement pod in the persistence test would rewrite
      # seeded.txt with a fresh timestamp and the test would prove nothing.
      # Seeding only when seeded.txt is absent is what makes "same timestamp,
      # different pod" the actual evidence that the data lives on the volume.
      # To force a re-seed, delete /usr/share/nginx/html/seeded.txt in the pod.
      initContainers:
        - name: seed-content
          # Fully qualified on purpose. OKE worker nodes run cri-o with
          # short-name-mode = "enforcing" in /etc/containers/registries.conf:
          # unlike Docker it will not guess a registry for a bare name, and
          # fails the pod with ImageInspectError rather than defaulting to
          # Docker Hub. See docs/LAB_LOG.md problem 8.
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /content/seeded.txt ]; then
              echo "already seeded: $(cat /content/seeded.txt) - leaving the volume untouched"
              exit 0
              fi
              # Body and terminator of the heredoc below must stay at column 0
              # of the rendered script, so they are not indented further here.
              cat > /content/index.html <<'HTML'
              <!doctype html>
              <html><head><meta charset="utf-8"><title>Ejada Week 3 - OKE</title>
              <style>body{font-family:system-ui,sans-serif;margin:4rem auto;max-width:40rem;line-height:1.6}
              code{background:#f2f2f2;padding:.1rem .3rem;border-radius:3px}</style></head>
              <body>
              <h1>Ejada Internship &mdash; Week 3</h1>
              <p>Served by NGINX on <strong>Oracle Container Engine for Kubernetes</strong>.</p>
              <ul>
                <li>Cluster: VCN-native pod networking (<code>OCI_VCN_IP_NATIVE</code>)</li>
                <li>Storage: this file lives on an external OCI Block Volume, mounted through the CSI driver</li>
                <li>Exposure: OCI Load Balancer, provisioned by a Kubernetes <code>Service</code> of type <code>LoadBalancer</code></li>
              </ul>
              <p>Infrastructure built with reusable Terraform modules.</p>
              </body></html>
              HTML
              echo "seeded at $(date -u)" > /content/seeded.txt
          volumeMounts:
            - name: content
              mountPath: /content
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: nginx-content
